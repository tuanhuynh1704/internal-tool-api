# =============================================================================
# docker-compose.yml — Internal Tool API (API Tester Pro)
# =============================================================================
# Tiện ích điều phối môi trường build trong container.
# Giúp bạn đóng gói ứng dụng mà không cần cài Go, Node.js, Wails CLI hay GTK.
#
# Cách dùng:
#   docker compose run --rm build-windows  # Build ra file .exe cho Windows -> ./dist/
#   docker compose run --rm build-linux    # Build ra binary cho Linux       -> ./dist/
#   docker compose run --rm shell          # Mở terminal container để kiểm tra/debug
# =============================================================================

services:

  # ── Build cho Windows (Cross-compile ra Internal Tool API.exe + updater.exe) ──
  build-windows:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        TARGET: windows
    volumes:
      - ./dist:/output
    command: >
      sh -c "mkdir -p /output &&
             cp -r /export/. /output/ &&
             echo '---------------------------------------------------' &&
             echo '✅ Build Windows thành công!' &&
             echo '📁 Các file nhị phân đã được xuất ra thư mục ./dist/:' &&
             ls -lh /output &&
             echo '---------------------------------------------------'"

  # ── Build cho Linux (ELF binary + updater) ───────────────────────────────────
  build-linux:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        TARGET: linux
    volumes:
      - ./dist:/output
    command: >
      sh -c "mkdir -p /output &&
             cp -r /export/. /output/ &&
             echo '---------------------------------------------------' &&
             echo '✅ Build Linux thành công!' &&
             echo '📁 Các file nhị phân đã được xuất ra thư mục ./dist/:' &&
             ls -lh /output &&
             echo '---------------------------------------------------'"

  # ── Shell Container để debug hoặc chạy lệnh thủ công ─────────────────────────
  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/app
    entrypoint: /bin/bash
    stdin_open: true
    tty: true
