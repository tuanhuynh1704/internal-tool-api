name: Release

on:
  push:
    tags:
      - 'v*'

# Ensures only one release runs at a time per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: internal-api-client
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # ── Build: Windows (main app + updater) ───────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $v"

      - name: Build updater (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path internal/updater/bin | Out-Null
          go build -trimpath -ldflags="-s -w -buildid=" -o internal/updater/bin/updater.exe ./cmd/updater/

      # The app embeds this binary and launches it with --sha256; embedding the
      # committed stub or an outdated updater would break every future update.
      - name: Check embedded updater (Windows)
        shell: bash
        run: |
          BIN=internal/updater/bin/updater.exe
          if [ "$(wc -c < "$BIN")" -lt 100000 ]; then
            echo "::error::$BIN looks like the stub, not a real updater build"; exit 1
          fi
          USAGE=$("$BIN" -h 2>&1 || true)
          if ! grep -q -- '-sha256' <<<"$USAGE"; then
            echo "::error::$BIN does not support --sha256"; exit 1
          fi

      - name: Build main app (Windows)
        run: wails build -clean -trimpath -platform windows/amd64 -ldflags "-s -w -buildid="

      - name: Stage Windows dist artifacts
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist-bin | Out-Null

          # Find the built executable and copy it to dist-bin with standard name
          $builtExe = Get-ChildItem build/bin/*.exe | Where-Object { $_.Name -ne 'updater.exe' } | Select-Object -First 1
          if (-not $builtExe) {
            Write-Error "Built executable not found in build/bin/"
            exit 1
          }
          Copy-Item $builtExe.FullName -Destination "dist-bin/${{ env.APP_NAME }}-v$v.exe" -Force
          Copy-Item "internal/updater/bin/updater.exe" -Destination "dist-bin/updater.exe" -Force

          Write-Host "Staged Windows artifacts:"
          Get-ChildItem dist-bin

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist-bin/*
          retention-days: 1

  # ── Build: Linux ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            gcc pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build updater (Linux)
        run: |
          mkdir -p internal/updater/bin
          go build -trimpath -ldflags="-s -w -buildid=" -o internal/updater/bin/updater ./cmd/updater/

      - name: Check embedded updater (Linux)
        run: |
          BIN=internal/updater/bin/updater
          if [ "$(wc -c < "$BIN")" -lt 100000 ]; then
            echo "::error::$BIN looks like the stub, not a real updater build"; exit 1
          fi
          USAGE=$("$BIN" -h 2>&1 || true)
          if ! grep -q -- '-sha256' <<<"$USAGE"; then
            echo "::error::$BIN does not support --sha256"; exit 1
          fi

      - name: Build main app (Linux)
        run: wails build -clean -trimpath -platform linux/amd64 -ldflags "-s -w -buildid="

      - name: Stage Linux dist artifacts
        run: |
          VERSION=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          mkdir -p dist-bin
          BUILT_BIN=$(find build/bin -maxdepth 1 -type f ! -name 'updater' | head -n 1)
          if [ -z "$BUILT_BIN" ]; then
            echo "ERROR: Built binary not found in build/bin/"
            exit 1
          fi
          cp "$BUILT_BIN" "dist-bin/${{ env.APP_NAME }}-v${VERSION}"
          cp internal/updater/bin/updater dist-bin/updater
          chmod +x dist-bin/*
          echo "Staged Linux artifacts:"
          ls -la dist-bin/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist-bin/*
          retention-days: 1

  # ── Release: Publish GitHub Release with manifest ─────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/windows/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux/

      - name: Compute SHA-256 checksums
        id: sha
        run: |
          set -e
          V="${{ needs.build-windows.outputs.version }}"
          if [ -z "$V" ]; then
            V=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          fi
          APP="${{ env.APP_NAME }}"

          echo "Inspecting downloaded artifact files:"
          ls -la dist/windows/
          ls -la dist/linux/

          WIN_EXE="dist/windows/${APP}-v${V}.exe"
          LINUX_BIN="dist/linux/${APP}-v${V}"

          if [ ! -f "$WIN_EXE" ]; then
            echo "ERROR: Windows binary $WIN_EXE was not found!"
            exit 1
          fi
          if [ ! -f "$LINUX_BIN" ]; then
            echo "ERROR: Linux binary $LINUX_BIN was not found!"
            exit 1
          fi

          WIN_SHA=$(sha256sum "$WIN_EXE" | awk '{print $1}')
          LINUX_SHA=$(sha256sum "$LINUX_BIN" | awk '{print $1}')

          echo "win_sha=$WIN_SHA"   >> $GITHUB_OUTPUT
          echo "linux_sha=$LINUX_SHA" >> $GITHUB_OUTPUT
          echo "version=$V"         >> $GITHUB_OUTPUT

          echo "Windows SHA256:  $WIN_SHA"
          echo "Linux SHA256:    $LINUX_SHA"

      - name: Generate latest.json
        run: |
          V="${{ steps.sha.outputs.version }}"
          APP="${{ env.APP_NAME }}"
          REPO="TuansHuynh/internal-tool-api"
          BASE="https://github.com/${REPO}/releases/download/v${V}"

          cat > dist/latest.json << EOF
          {
            "version": "${V}",
            "platforms": {
              "windows-amd64": {
                "url": "${BASE}/${APP}-v${V}.exe",
                "sha256": "${{ steps.sha.outputs.win_sha }}"
              },
              "linux-amd64": {
                "url": "${BASE}/${APP}-v${V}",
                "sha256": "${{ steps.sha.outputs.linux_sha }}"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat dist/latest.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The app only accepts latest.json with a valid latest.json.sig made by
      # a key embedded in internal/updater/signature.go. signmanifest fails if
      # the secret is missing or does not match those keys.
      - name: Sign latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          go run ./cmd/signmanifest -in dist/latest.json
          go run ./cmd/signmanifest -verify -in dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.sha.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/windows/${{ env.APP_NAME }}-v${{ steps.sha.outputs.version }}.exe
            dist/windows/updater.exe
            dist/linux/${{ env.APP_NAME }}-v${{ steps.sha.outputs.version }}
            dist/linux/updater
            dist/latest.json
            dist/latest.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
